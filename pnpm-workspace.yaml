allowBuilds:
  baileys: false
  electron: true
  onnxruntime-node: false
  protobufjs: false

# libsignal, brought by baileys, is a git dependency; pnpm refuses those by default. Allowed on purpose (RISKS R-01/R-05): the lockfile pins it by commit hash.
blockExoticSubdeps: false

minimumReleaseAgeExclude:
  - nodemailer@10.4.0

# Patched versions of transitive dependencies (RISKS R-01). Each line names the parent when the fix crosses a major.
overrides:
  body-parser: ^2.4.0
  follow-redirects: ^1.16.2
  fast-uri: ^3.1.9
  mailparser>nodemailer: ^10.4.0
  exceljs>uuid: ^11.1.1
  pptxgenjs>image-size: ^2.0.3
  "@excalidraw/excalidraw>nanoid": ^3.3.18
  "@excalidraw/mermaid-to-excalidraw>nanoid": ^5.1.16
  lodash-es: ^4.18.1
  mermaid>katex: ^0.18.2
